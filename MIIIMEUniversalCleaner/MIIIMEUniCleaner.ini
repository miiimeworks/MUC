; MIIIME Universal Cleaner Configuration
; ⓒ 2026 MIIIME

[Launch]
AppName=MIIIME Universal Cleaner

[Settings]
RunAsAdmin=0
ShowFinishMsg=1

[Options]
LogLevel=0
LinkedIniName=|*_x64_M|*_M|*_x86_M|MIIIMEUniWrapper|

; ----------------------------------------------------------------------------------------
; ※ 아래 4개 섹션은 LinkedMode=1 이면 연동 INI(런처 INI)의 같은 이름 섹션을 읽음.
;   이 파일의 섹션에는 항목을 적지 않음 (적어도 무시되고 WARN). 독립 실행하려면 LinkedMode=0 으로 바꾸고 항목을 적음.
; ※ With LinkedMode=1 each of the four sections below reads the section of the same name in the linked INI (launcher INI).
;   Do not write entries in this file's section (ignored with a WARN). To run standalone, set LinkedMode=0 and write entries.
; ※ 실행 순서 / Order : CleanupExclude → CleanupDelete → SharedClean → TraceClean
[CleanupExclude]
LinkedMode=1
; 독립 실행(LinkedMode=0) 예시 / Standalone example (LinkedMode=0):
;01={Roaming}\MyApp\profile\prefs.js
;02={Roaming}\MyApp\profile\chrome

[CleanupDelete]
LinkedMode=1
; 독립 실행(LinkedMode=0) 예시 / Standalone example (LinkedMode=0):
;01={Roaming}\MyApp\Cache
;02={Local}\MyApp\BrowserMetrics

[SharedClean]
LinkedMode=1
; 독립 실행(LinkedMode=0) 예시 / Standalone example (LinkedMode=0):
;Name=|TargetApp.7z|

[TraceClean]
LinkedMode=1
; 연동(LinkedMode=1) : 연동 INI 의 Name 을 읽음. 보통 Name=|{Exe}|{Launcher}| (연동 INI 에 적음. 이 파일에는 적지 않음)
; 독립 실행(LinkedMode=0) 예시 / Standalone example (LinkedMode=0, 로컬 절대 경로만 / local absolute paths only):
;Name=|D:\Portable\TargetApp\TargetApp.exe|

[Advanced]
RetryLimit=10
RetryDelay=50
LogRotationSize=5242880
