; MIIIME Universal Cleaner Configuration
; © 2026 MIIIME

[Launch]
; 메시지 창 등에 표시되는 프로그램 이름.
; Application name shown in message boxes, etc.
AppName=MIIIME Universal Cleaner

[Settings]
; 관리자 권한으로 실행 (1=사용, 0=미사용).
; Run as administrator (1=Enable, 0=Disable).
RunAsAdmin=0

; 작업 완료 후 메시지 표시 (1=표시, 0=미표시).
; Show completion message after tasks finish (1=Show, 0=Hide).
ShowFinishMsg=1

[Options]
; LogLevel : 0=Off, 1=All(INFO/WARN/ERROR), 2=DEBUG, 3=INFO, 4=WARN, 5=ERROR
LogLevel=0

; 연동모드 파일명 / Linked Mode Filename
; 연동 INI(런처 INI 등)는 LinkedMode=1 인 섹션이 하나라도 있을 때만 이 설정으로 찾음. (모두 LinkedMode=0 이면 찾지 않으며 에러도 없음)
; The linked INI (launcher INI, etc.) is searched with this setting only when at least one section has LinkedMode=1. (If all are 0, it is not searched and no error occurs.)
;
; 파이프(|)로 구분된 항목을 앞에서부터 차례로 탐색하며, .ini 가 발견된 첫 항목에서 멈춤 (뒤 항목은 보지 않음).
; Entries separated by pipes (|) are searched in order; the search stops at the first entry that finds a .ini file.
;   - 와일드카드 ~ ^ 사용 가능 / Wildcards ~ ^ are supported.  (예 / e.g. *_x64_M → *_x64_M.ini)
;   - 와일드카드가 없으면 정확한 파일명 / Without wildcards, an exact file name.  (예 / e.g. MIIIMEUniWrapper → MIIIMEUniWrapper.ini)
;   - 한 항목에서 2개 이상 발견되면 에러 / An error occurs if one entry finds two or more files.
;   - 어느 항목에서도 없으면 에러 / An error occurs if no entry finds a file.
; 예 / Example : |*_x64_M|*_x86_M|*_M|
;   → *_x64_M.ini 가 있으면 그것만 사용 (*_x86_M, *_M 은 보지 않음).
;   → If *_x64_M.ini exists, only it is used (*_x86_M and *_M are not checked).
; 기본값 / Default : |*_x64_M|*_M|*_x86_M|
LinkedIniName=|*_x64_M|*_M|*_x86_M|MIIIMEUniWrapper|

[CleanupExclude]
; 지정되지 않은 항목 삭제 (Exclude 방식)
; Delete unspecified items (Exclude mode)
; ----------------------------------------------------------------------------------------

; ※ 실행 순서 / Order : CleanupExclude → CleanupDelete → SharedClean → TraceClean.
;   런처의 SmartSkip 은 보지 않고, 항목이 있으면 실행함. (런처 SmartSkip=2 로 두고 필요할 때 이 프로그램으로 정리하는 용도)
;   SmartSkip of the launcher is not checked; a section runs whenever it has entries. (Keep the launcher at SmartSkip=2 and run this program when needed.)

; 이 섹션을 어느 INI 에서 읽을지 선택함. 4개 섹션([CleanupExclude] / [CleanupDelete] / [SharedClean] / [TraceClean])마다 따로 지정함.
; Chooses which INI this section is read from. Set it separately for each of the four sections.
;   LinkedMode=1 : 연동 INI 의 같은 이름 섹션을 읽음. 이 파일의 이 섹션에는 항목을 적지 않음 (적어도 무시되고 WARN).
;                  Reads the section of the same name from the linked INI. Do not write entries in this section of this file (ignored with a WARN).
;   LinkedMode=0 : 이 파일의 이 섹션을 읽음 (독립 모드).
;                  Reads this section of this file (standalone mode).
; - LinkedMode 가 없는 섹션은 0 으로 처리함. / A section without LinkedMode is treated as 0.
; - 호환 규칙 (2.4.0.0 방식) : 어느 섹션에도 LinkedMode 가 없으면, 이 파일의 [CleanupExclude] / [CleanupDelete] 에 항목이 1개 이상 있을 때
;   모든 섹션을 이 파일에서, 없을 때 모든 섹션을 연동 INI 에서 읽음.
;   Compatibility rule (2.4.0.0 behavior): if no section has LinkedMode, all sections are read from this file when [CleanupExclude] / [CleanupDelete]
;   of this file have one or more entries; otherwise all sections are read from the linked INI.
LinkedMode=1

; 항목은 LinkedMode=0 일 때만 이 파일에 적음. (LinkedMode=1 이면 연동 INI 의 항목을 사용)
; Write entries in this file only when LinkedMode=0. (With LinkedMode=1 the entries of the linked INI are used.)

; 매크로 지원 / Macros supported : {Base} {Local} {Roaming} {LocalLow} {Temp} {UserProfile} %ENV%
;   (연동 INI 가 있으면 {Run} {Dat} {Raw} {Ext} {Ast} {Env} {Res} {Usr} {CommonFiles} {_MIIIMEEnv} {AppName} 도 사용 가능 / With a linked INI, {Run} {Dat} {Raw} {Ext} {Ast} {Env} {Res} {Usr} {CommonFiles} {_MIIIMEEnv} {AppName} are also available.)
;   ({AppName} 은 연동 INI 에 [Launch] 섹션이 있을 때만 풀림. 런처의 AppName 이며 이 프로그램의 [Launch] AppName 과는 별개 / {AppName} is resolved only when the linked INI has a [Launch] section. It is the launcher's AppName, not this program's [Launch] AppName.)

; 와일드카드 / Wildcards  : ~ ^
; 	~ 	→  0개 이상의 임의 문자 / Any number of any characters.
; 	^ 	→  정확히 1개의 임의 문자 / Exactly one character (any).

; 예시 / Example (LinkedMode=0):
; 01={Roaming}\MyApp\profile\prefs.js
; 02={Roaming}\MyApp\profile\chrome
; → {Roaming}\MyApp\profile 폴더 안에서 prefs.js, chrome 보존하고 나머지 삭제.

; ── 내장 안전장치 / Built-in Safety Guard ──
; 보존 목록의 부모 폴더는 다음 기본 규칙으로 검사되며, 위반 시 해당 그룹은 로그에 기록되고 건너뜀.
; The parent folder of the keep list is checked by the default rules below; a violating group is logged and skipped.
;   - 로컬 절대 경로만 허용 (같은 UNC 공유 포함) / Local absolute paths only (plus UNC share of the base folder).
;   - 드라이브 루트, 기준 폴더({Base})와 그 상위 폴더, Cleaner exe / ini / 로그는 항상 차단 / Always blocked.
;   - 기본 차단 / Blocked by default : Documents, Desktop, Downloads, Pictures, Music, Videos, Favorites, Links,
;     Saved Games, Searches, OneDrive, Dropbox, Google Drive, Microsoft, Windows, Packages, Boot, PerfLogs, ProgramFiles, ProgramFiles(x86).
;   - 독립 모드에도 동일하게 적용됨 / Also applies in standalone mode.

[CleanupDelete]
; 지정 항목 삭제 (Delete 방식)
; Delete specified items (Delete mode)
; ----------------------------------------------------------------------------------------

; 이 섹션을 어느 INI 에서 읽을지 선택함. (1=연동 INI, 0=이 파일. 자세한 설명은 [CleanupExclude] 참조)
; Chooses which INI this section is read from. (1=linked INI, 0=this file. See [CleanupExclude] for details.)
LinkedMode=1

; 항목은 LinkedMode=0 일 때만 이 파일에 적음.
; Write entries in this file only when LinkedMode=0.

; 매크로 지원, 와일드카드 : 상동
; Macros supported, Wildcards : Same as above

; 예시 / Example (LinkedMode=0):
; 01={Roaming}\MyApp\Cache
; 02={Local}\MyApp\BrowserMetrics
; 03={Temp}\MyApp_Temp_*
; 04={Roaming}\Obsidian\^^^^^^^^^^^^^^^^.json

; ── 내장 안전장치 / Built-in Safety Guard ──
; 삭제 대상(와일드카드로 해석된 실제 대상 포함)은 다음 기본 규칙으로 검사되며, 위반 항목은 로그에 기록되고 건너뜀.
; Delete targets (including wildcard-resolved ones) are checked by the default rules below; violating entries are logged and skipped.
;   - 로컬 절대 경로만 허용 (같은 UNC 공유 포함) / Local absolute paths only (plus UNC share of the base folder).
;   - 드라이브 루트, 기준 폴더({Base})와 그 상위 폴더, Cleaner exe / ini / 로그는 항상 차단 / Always blocked.
;   - 기본 차단 / Blocked by default : Documents, Desktop, Downloads, Pictures, Music, Videos, Favorites, Links,
;     Saved Games, Searches, OneDrive, Dropbox, Google Drive, Microsoft, Windows, Packages, Boot, PerfLogs, ProgramFiles, ProgramFiles(x86).
;   - 따라서 {Desktop}\*.lnk 같은 바탕화면 바로가기 삭제는 기본적으로 차단됨.
;     Therefore deleting desktop shortcuts such as {Desktop}\*.lnk is blocked by default.

[SharedClean]
; 공용 레지스트리 정리: 여러 프로그램이 함께 쓰는 영역에서 "이름이 일치하는 값" 만 삭제
; Shared registry cleanup: delete only values whose NAME matches, in areas shared by several programs
; ----------------------------------------------------------------------------------------

; 용도 : 같은 확장자 아래 OpenWithProgids 등에 남은 "내 프로그램 이름의 값" 만 지움. 백업 · 복원 없는 편도(one-way) 삭제임.
; Purpose : removes only the values with MY program's name left under OpenWithProgids, etc. One-way delete with no backup/restore.
;
; 동작 :
;   - 기본 영역 (HKCU 만) : HKEY_CURRENT_USER\SOFTWARE\Classes , HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FileExts
;     각 영역의 값, 바로 아래 키(.7z 같은 확장자 키)의 값, 그 아래 OpenWithProgids 의 값을 훑음. (더 깊이는 훑지 않음)
;   - 값 이름이 비어 있는 기본값은 절대 지우지 않으며, 키 자체도 지우지 않음.
; Behavior :
;   - Default areas (HKCU only): the two above. Scans values of the area, of each key directly under it (extension keys such as .7z),
;     and of OpenWithProgids below that key. Nothing deeper.
;   - Never deletes a nameless (Default) value or any key.

; ※ 한계 / Limitations
;   - 이 프로그램은 호스트 값 보호 기능이 없음. 런처와 달리 실행 시점에 이름이 일치하는 값을 모두 지우므로,
;     원래 호스트(진짜 설치본 등)에 있던 같은 이름의 값도 함께 지워질 수 있음. 패턴을 구체적으로 적을 것. (예: WinMount.~ 보다 WinMount.7z)
;   - 이름만 비교하므로 다른 프로그램이 같은 이름의 값을 쓰면 함께 지워짐.
;   - 연동 INI 를 읽는 런처 exe (x64 / x86 / _M 이름 모두) 또는 타겟 exe({Exe}) 가 실행 중이면 WARN 로그를 남기고 건너뜀.
;   - 런처가 크래시로 남긴 스냅샷 폴더 (임시 폴더의 MIIIMESnap_<AppName>_*) 가 있으면 WARN 한 줄을 남김. 이 프로그램은 그 폴더를 지우지도, 읽어서 값을 보호하지도 않음. (정리는 MLS)
;   - 어떤 값을 지웠는지는 로그(LogLevel=1 이상)의 "Deleted(Value)" 줄로 확인할 수 있음.
;   - This program has no host-value protection. Unlike the launcher, it deletes every value whose name matches at run time,
;     so a same-named value that originally belonged to the host (a real installation, etc.) can be deleted too. Write specific patterns. (e.g. WinMount.7z rather than WinMount.~)
;   - Only names are compared, so another program's value with the same name is deleted as well.
;   - If a launcher exe that reads the linked INI (x64 / x86 / _M names alike) or the target exe ({Exe}) is running, this section is skipped with a WARN log.
;   - If a snapshot folder left by a launcher crash (MIIIMESnap_<AppName>_* in the temp folder) exists, one WARN line is logged. This program neither deletes that folder nor uses it to protect values. (Cleaning it up is MLS's job.)
;   - The values deleted can be checked in the "Deleted(Value)" lines of the log (LogLevel 1 or higher).

; 이 섹션을 어느 INI 에서 읽을지 선택함. (1=연동 INI, 0=이 파일. 자세한 설명은 [CleanupExclude] 참조)
; Chooses which INI this section is read from. (1=linked INI, 0=this file. See [CleanupExclude] for details.)
LinkedMode=1

; 지울 값 이름 패턴 (|패턴1|패턴2| 형식). LinkedMode=0 일 때만 이 파일에 적음. (LinkedMode=1 이면 연동 INI 의 Name 을 사용)
; 대소문자 무시. 와일드카드 : ~ (0개 이상 임의 문자), ^ (정확히 1개 임의 문자).
; 키가 없거나 비어 있으면 아무것도 지우지 않음. 와일드카드가 아닌 글자가 3개 미만인 패턴은 WARN 후 무시됨. \ 나 제어 문자가 있는 패턴도 무시됨.
; ※ 값 "이름" 만 비교함. ProgID 이름(예: TargetApp.7z)을 적고, 실행 파일 경로는 쓰지 않음.
; Value-name patterns to delete (|pattern1|pattern2| format). Write them in this file only when LinkedMode=0. (With LinkedMode=1 the Name of the linked INI is used.)
; Case-insensitive. Wildcards: ~ (any number of characters), ^ (exactly one).
; If the key is missing or empty nothing is deleted. Patterns with fewer than 3 literal characters are ignored with a WARN, as are patterns containing \ or control characters.
; Only value NAMES are compared. Use ProgID names (e.g. TargetApp.7z); do not use exe paths.
; 예시 / Example (LinkedMode=0):
;Name=|TargetApp.7z|

[TraceClean]
; 실행 흔적(MuiCache / UserAssist) 레지스트리 값 삭제
; Delete execution-trace registry values (MuiCache / UserAssist)
; ----------------------------------------------------------------------------------------

; 동작 :
;   - 대상마다 내장 위치(MuiCache / ShellNoRoam MUICache / UserAssist)의 해당 값만 지움. 다른 프로그램의 기록은 건드리지 않음.
;   - 값 하나씩만 지우며 키 자체는 지우지 않음. HKCU 만 대상이며 백업 / 복원이 없는 편도(one-way) 삭제임.
;   - 실행 순서상 맨 마지막에 실행됨.
; Behavior :
;   - For each target, only its own values in the built-in locations (MuiCache / ShellNoRoam MUICache / UserAssist) are removed. Other programs' records are never touched.
;   - Deletes values one by one and never a key. HKCU only; one-way delete with no backup/restore.
;   - Runs last in the order.

; ※ 한계 / Limitations
;   - 연동 INI 를 읽는 런처 exe (x64 / x86 / _M 이름 모두) 또는 타겟 exe({Exe}) 가 실행 중이면 WARN 로그를 남기고 건너뜀. (실행 중에는 흔적이 계속 다시 기록되므로)
;   - If a launcher exe that reads the linked INI (x64 / x86 / _M names alike) or the target exe ({Exe}) is running, this section is skipped with a WARN log. (Traces keep being re-written while it runs.)

; 이 섹션을 어느 INI 에서 읽을지 선택함. (1=연동 INI, 0=이 파일. 자세한 설명은 [CleanupExclude] 참조)
; Chooses which INI this section is read from. (1=linked INI, 0=this file. See [CleanupExclude] for details.)
LinkedMode=1

; 흔적을 지울 대상 (|이름1|이름2| 형식). 의미가 LinkedMode 에 따라 다름.
; Targets whose traces are removed (|Name1|Name2| format). The meaning depends on LinkedMode.
;
; LinkedMode=1 : 연동 INI 의 Name 을 읽음. 런처와 같은 규칙으로, 아래 3가지만 사용할 수 있음. 이 파일에는 적지 않음.
;   |{Exe}|              타겟 exe 만
;   |{Launcher}|         런처만 (x64 / x86 / _M 런처가 함께 있으면 연동 INI 를 읽는 것 모두)
;   |{Exe}|{Launcher}|   둘 다 (연동 INI 에 Name 키가 없을 때의 기본값)
;   그 외의 값은 로그에 WARN 을 남기고 무시됨.
; LinkedMode=1 : Reads Name from the linked INI, with the same rules as the launcher. Only these three values are accepted. Do not write it in this file.
;   Any other value is ignored and a WARN is logged. ({Launcher} covers every launcher exe that reads the linked INI when x64 / x86 / _M launchers coexist.)
;
; LinkedMode=0 : 이 파일의 Name 을 읽음. 로컬 절대 경로(exe 전체 경로)만 사용할 수 있음. {Exe} / {Launcher} 는 지원하지 않음.
;   키가 없거나 비어 있으면 아무것도 지우지 않음. 상대 경로 / ".." 구성 요소 / 금지 문자(< > : * ? " | /)가 있는 이름은 무시됨.
; LinkedMode=0 : Reads Name from this file. Only local absolute paths (full exe paths) are accepted. {Exe} / {Launcher} are not supported.
;   If the key is missing or empty nothing is deleted. Names that are relative, contain ".." components or forbidden characters (< > : * ? " | /) are ignored.
; 예시 / Example (LinkedMode=0):
;Name=|D:\Portable\SomeApp\SomeApp.exe|

[Advanced]
; 파일 이동/삭제 실패 시 재시도 횟수.
; Number of retries on file move/delete failure.
RetryLimit=10

; 재시도 간격 (밀리초).
; Retry interval (milliseconds).
RetryDelay=50

; 로그 파일 최대 크기 (Bytes, 초과 시 .old 로 백업 후 새로 시작) 기본값 5242880 = 5MB.
; Maximum log file size in bytes (rotates to .old when exceeded) default 5242880 = 5MB.
LogRotationSize=5242880
